server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: agenda-banda-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:AgendaBanda};encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:agenda_user}
    password: ${DB_PASSWORD:agenda123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  jackson:
    time-zone: America/Sao_Paulo
app:
  auth:
    login:
      limite: ${AUTH_LOGIN_LIMITE:20}
      janela-minutos: ${AUTH_LOGIN_JANELA_MINUTOS:15}
    cadastro:
      limite: ${AUTH_CADASTRO_LIMITE:5}
      janela-minutos: ${AUTH_CADASTRO_JANELA_MINUTOS:60}
    recuperacao:
      limite: ${AUTH_RECUPERACAO_LIMITE:10}
      janela-minutos: ${AUTH_RECUPERACAO_JANELA_MINUTOS:15}
      pendente-horas: ${AUTH_RECUPERACAO_PENDENTE_HORAS:24}
      aprovada-horas: ${AUTH_RECUPERACAO_APROVADA_HORAS:2}
      varredura-ms: ${AUTH_RECUPERACAO_VARREDURA_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
